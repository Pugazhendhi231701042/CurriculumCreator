<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Creator</title>
    <meta name="description" content="Auto-detect course syllabus fields, preview document, and export.">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./Assets/rec.ico">
    <!-- Google Fonts: Poppins, Outfit and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="./styles.css?v=20260818_v13">
    <!-- docx.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.2.4/build/index.iife.js"></script>
    <!-- SheetJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header with Brand Logo & Settings Button -->
        <header class="app-header">
            <div class="header-top-bar">
                <a href="index.html" class="btn btn-secondary">
                    <span class="icon">←</span> Back to Home
                </a>
                <div class="badge-pill">
                    <span class="pulse-dot"></span> Curriculum & Syllabi
                </div>
                <button type="button" class="btn btn-secondary btn-settings" id="btnOpenSettings">
                    <span class="icon">⚙️</span> Settings
                </button>
            </div>

            <div class="logo">
                <img src="./Assets/logo.png" alt="Curriculum Creator Logo" class="header-logo">
                <h1>AI Smart Paste Studio</h1>
            </div>
        </header>

        <main>
            <!-- AI PASTE STUDIO CARD -->
            <section class="card smart-parser-card">
                <div class="card-header">
                    <span class="step-num spark-icon">⚡</span>
                    <div>
                        <h2>Paste Course Content</h2>
                    </div>
                </div>

                <div class="parser-body">
                    <div class="form-group">
                        <label for="quickPasteArea">Raw Syllabus Content</label>
                        <textarea id="quickPasteArea" rows="9" placeholder="Paste syllabus content here..."></textarea>
                    </div>

                    <div class="form-group" style="margin-top: 1rem;">
                        <label for="branches">Branch(es) / Department <span class="required">*</span></label>
                        <input type="text" id="branches" placeholder="e.g. Common to All Branches, CSE, ECE, IT...">
                    </div>
                    
                    <div class="parser-actions" style="margin-top: 1.25rem;">
                        <button type="button" class="btn btn-spark" id="btnQuickParse">
                            <span class="icon">🚀</span> AI Parse & Generate Preview
                        </button>
                    </div>

                    <!-- Live Parser Stats Feedback Banner -->
                    <div id="parserFeedback" class="parser-feedback hidden">
                        <div class="feedback-header">
                            <span class="feedback-icon">✨</span>
                            <span class="feedback-title">Smart Parsing Results</span>
                        </div>
                        <div id="feedbackStats" class="feedback-stats"></div>
                    </div>
                </div>
            </section>

            <!-- HIDDEN FIELDS FOR PREVIEW & DOCX STORAGE IN AI MODE (DEFAULTING TO 0) -->
            <div style="display:none;">
                <input type="text" id="subjectCode">
                <input type="text" id="subjectName">
                <input type="text" id="category">
                <input type="number" id="lValue" value="0">
                <input type="number" id="tValue" value="0">
                <input type="number" id="pValue" value="0">
                <input type="number" id="cValue" value="0">
                <select id="courseType"><option value="Theory">Theory</option><option value="Lab">Lab</option><option value="Lab Oriented Theory">Lab Oriented Theory</option></select>
                <div id="objectivesContainer"></div>
                <div id="outcomesContainer"></div>
                <div id="textbooksContainer"></div>
                <div id="referencesContainer"></div>
                <div id="experimentsContainer"></div>
                <input type="text" id="unit1Title"><input type="number" id="unit1Hours" value="0"><textarea id="unit1Syllabus"></textarea>
                <input type="text" id="unit2Title"><input type="number" id="unit2Hours" value="0"><textarea id="unit2Syllabus"></textarea>
                <input type="text" id="unit3Title"><input type="number" id="unit3Hours" value="0"><textarea id="unit3Syllabus"></textarea>
                <input type="text" id="unit4Title"><input type="number" id="unit4Hours" value="0"><textarea id="unit4Syllabus"></textarea>
                <input type="text" id="unit5Title"><input type="number" id="unit5Hours" value="0"><textarea id="unit5Syllabus"></textarea>
                <span id="totalHoursVal">0</span>
            </div>

            <br><br>

            <!-- LIVE DOCUMENT PREVIEW CARD -->
            <section id="previewCard" class="card preview-card hidden">
                <div class="preview-card-header">
                    <div class="preview-title">
                        <span class="icon">👁️</span>
                        <h2>Document Live Preview</h2>
                    </div>
                </div>
                <div class="preview-document-wrapper">
                    <div id="documentPreview" class="document-preview">
                        <!-- Dynamically rendered live preview -->
                    </div>
                </div>

                <!-- ACTION BUTTONS MOVED BELOW LIVE PREVIEW -->
                <div class="preview-actions-bar">
                    <button type="button" class="btn btn-gold-download" id="btnPreviewDownload">
                        <span class="icon">📥</span> Download .DOCX
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnExportPDF">
                        <span class="icon">📄</span> Export as PDF
                    </button>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>Made with 💖 by Pugazhendhi B</p>
        </footer>
    </div>

    <!-- DOCUMENT SETTINGS MODAL -->
    <div id="settingsModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2>⚙️ Document Settings</h2>
                <button type="button" class="btn-close-modal" id="btnCloseSettings">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="docFontSelect">Select Document Font Family</label>
                    <select id="docFontSelect">
                        <option value="Poppins" selected>Poppins</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Calibri">Calibri</option>
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Cambria">Cambria</option>
                        <option value="Garamond">Garamond</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" id="btnSaveSettings">Apply Settings</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="./app.js?v=20260818_v13"></script>
</body>
</html>
